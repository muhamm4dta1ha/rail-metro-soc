name: ci

# Runs on every pull request into develop/main and on every push to them (hard constraint HC-14).
# Branch protection should require ONE check: "ci-gate" (it is green only if every job below is green).

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy (branch, attribution, files)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Branch naming and PR flow
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/policy_check.py branch --head "$HEAD_REF" --base "$BASE_REF"
      - name: No AI attribution in commits or PR text
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git log --format='%B%n----' "$BASE_SHA..$HEAD_SHA" > "$RUNNER_TEMP/text.txt"
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" >> "$RUNNER_TEMP/text.txt"
          python scripts/policy_check.py attribution --file "$RUNNER_TEMP/text.txt"
      - name: No secrets or oversized files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/policy_check.py files --base "$BASE_SHA" --head "$HEAD_SHA" --max-mb 10

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: common, lint: src/common, tests: src/common/tests, extras: dev }
          - { name: simulation, lint: src/simulation, tests: src/simulation/tests, extras: "dev,sim" }
          - { name: attacks, lint: src/attacks, tests: src/attacks/tests, extras: "dev,sim" }
          - { name: detection, lint: src/detection, tests: src/detection/tests, extras: dev }
          - { name: ml, lint: src/ml, tests: src/ml/tests, extras: "dev,ml" }
          - { name: repo, lint: "tests scripts", tests: tests, extras: dev }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[${{ matrix.extras }}]"
      - name: Lint
        run: ruff check ${{ matrix.lint }}
      - name: Tests
        run: python -m pytest ${{ matrix.tests }}

  compose:
    name: compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate the lab compose file
        run: docker compose -f src/simulation/docker-compose.yml --env-file src/simulation/.env.example config -q

  ci-gate:
    name: ci-gate
    if: always()
    needs: [policy, test, compose]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job must have passed (policy is skipped on pushes)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A required CI job did not succeed"
              exit 1
            fi
          done
